# CI — roda em cada push/PR. Portão de qualidade (o deploy é da Vercel, via
# integração Git — este CI NÃO faz deploy). Enquanto o repo for só docs (sem
# package.json), os jobs de código são pulados e o CI fica verde; assim que a
# Fase 0 adicionar o app Next.js, o pipeline completo passa a valer sozinho.
name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detecta app
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi

  lint-type:
    name: Lint + Typecheck
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  unit:
    name: Testes unitários
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    # Parte da suíte prova isolamento RLS e integridade da ingestão contra um
    # Postgres real — sem banco, esses casos se pulariam e o verde não valeria.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ligcentro
          POSTGRES_PASSWORD: ligcentro
          POSTGRES_DB: ligcentro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ligcentro -d ligcentro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ligcentro:ligcentro@localhost:5432/ligcentro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Aplica as migrações
        run: npm run db:migrate
      - run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 7 }

  build:
    name: Build (Next.js)
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: next-build, path: .next/, retention-days: 7 }

  e2e:
    name: Testes E2E (Playwright)
    needs: [detect, build]
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    # O `webServer` do Playwright faz o build e sobe o app; aqui só o banco.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ligcentro
          POSTGRES_PASSWORD: ligcentro
          POSTGRES_DB: ligcentro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ligcentro -d ligcentro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ligcentro:ligcentro@localhost:5432/ligcentro
      E2E_DATABASE_URL: postgresql://ligcentro:ligcentro@localhost:5432/ligcentro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Aplica as migrações
        run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }

  security:
    name: Segurança (SCA + segredos + SAST)
    runs-on: ubuntu-latest
    # pull-requests: read — o gitleaks consulta os commits do PR pela API.
    permissions: { security-events: write, contents: read, actions: read, pull-requests: read }
    steps:
      # fetch-depth: 0 — o gitleaks escaneia o range de commits do push.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          # Obrigatório desde o v2 para escanear pull requests (a action lê a
          # lista de commits do PR pela API); sem ele o job falha de saída.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem comentário automático no PR: manter o token em somente-leitura.
          # O achado aparece no log do job e reprova o portão de qualquer forma.
          GITLEAKS_ENABLE_COMMENTS: false
          # Allowlist de falsos positivos comprovados; ver .gitleaks.toml.
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Auditoria de dependências
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          # As vulnerabilidades de ferramentas de desenvolvimento não entram no artefato de produção.
          npm audit --omit=dev --audit-level=high

  # Gate final: verde se o app ainda não existe OU se todos os jobs passaram.
  # É este check único que a branch protection deve exigir.
  ci-passed:
    name: CI aprovado
    needs: [detect, lint-type, unit, build, e2e, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verifica resultados
        run: |
          if [ "${{ needs.detect.outputs.has_app }}" != "true" ]; then
            echo "Repo sem app (só docs) — CI verde por padrão."; exit 0
          fi
          # Jobs de teste têm de passar de verdade: aceitar "skipped" foi o que
          # permitiu o E2E ficar desligado com o portão verde (TCK-0016).
          for job in lint-type unit build e2e security; do
            case "$job" in
              lint-type) r="${{ needs.lint-type.result }}" ;;
              unit)      r="${{ needs.unit.result }}" ;;
              build)     r="${{ needs.build.result }}" ;;
              e2e)       r="${{ needs.e2e.result }}" ;;
              security)  r="${{ needs.security.result }}" ;;
            esac

            if [ "$r" != "success" ]; then
              echo "Job obrigatório não passou: $job ($r)"; exit 1
            fi
          done
          echo "Todos os jobs de CI passaram."
